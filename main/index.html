<!-- Undesirable if priority entails using macros -->
<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>ESP32 Image Upload</title>
        <style>
            img {
                max-width: 320px;
                margin-top: 1rem;
            }
        </style>
    </head>
    <body>
        <h1>Upload an Image</h1>
        Resolution: <input id="resolution" oninput="this.value=this.value.replace(/[^0-9]/g,'')+'px'"><input id="submit" type="button" onclick="set_resolution()" value="Submit"> <!-- Element `type` is "button" because document does not yet handle behaviour on submit -->
        <br>
        <input type="file" id="upload" accept="image/*"><br>
        <img id="uploaded" hidden>

        <script>
            threshold = 640; // Default maximum resolution; may be changed by user at runtime
            const resolution_input = document.getElementById('resolution');
            resolution_input.value = threshold+'px';
            function set_resolution() {
                const resolution = document.getElementById('resolution').value.slice(0,-2);
                if (resolution==threshold) {
                    console.log(`LOG: Resolution not updated; already set to ${threshold}px`);
                } else if (Number(resolution)>=1) {
                    threshold = Number(resolution);
                    console.log(`LOG: Resolution set to ${threshold}px`);
                    resolution_input.value = threshold+'px';
                } else {
                    console.error('LOG: Resolution not updated; must be at least 1px');
                }
            }
            resolution_input.addEventListener('input', (e) => {
                position = resolution_input.value.length-2;
                if (resolution_input.selectionStart > position) {
                    resolution_input.setSelectionRange(position, position);
                }
            });

            const input = document.getElementById('upload');
            const img = document.getElementById('uploaded');

            input.addEventListener('change', (event) => {
                const file = event.target.files[0];
                if (!file) return;

                const reader = new FileReader();
                reader.onload = (e) => {
                    const original = new Image();
                    original.onload = async () => {
                        const MAX_DIM = Math.max(original.width, original.height);
                        const SUBIMAGE_DIM = 64;
                        var SCALE_FACTOR = 1;
                        if (MAX_DIM > threshold) {
                            SCALE_FACTOR = threshold/MAX_DIM;
                        }
                        const NEW_WIDTH = original.width*SCALE_FACTOR;
                        const NEW_HEIGHT = original.height*SCALE_FACTOR;

                        const canvas = document.createElement('canvas');
                        canvas.width = NEW_WIDTH;
                        canvas.height = NEW_HEIGHT;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(original, 0, 0, canvas.width, canvas.height);

                        const dataRGBA = ctx.getImageData(0, 0, canvas.width, canvas.height).data;
                        imageBGW = new Uint8ClampedArray(dataRGBA.length);
                        for (l=0;l<(canvas.height/SUBIMAGE_DIM-1^0);l++) {
                            for (p=0;p<(canvas.width/SUBIMAGE_DIM-1^0);p++) {
                                subimage = new Uint8ClampedArray(4*2+SUBIMAGE_DIM*SUBIMAGE_DIM);
                                subimage_view = new DataView(subimage.buffer);
                                subimage_view.setUint16(0,SUBIMAGE_DIM,true);
                                subimage_view.setUint16(2,SUBIMAGE_DIM,true);
                                subimage_view.setUint16(4,SUBIMAGE_DIM*p,true);
                                subimage_view.setUint16(6,l*SUBIMAGE_DIM,true);
                                for (i=0; i<SUBIMAGE_DIM; i++) {
                                    for (j=0; j<SUBIMAGE_DIM; j++) {
                                        idx = canvas.width*(i+l*SUBIMAGE_DIM)+j+SUBIMAGE_DIM*p;
                                        
                                        subimage[4*2+SUBIMAGE_DIM*i+j]=(19595 * dataRGBA[4*idx] + 38470 * dataRGBA[4*idx+1] + 7471 * dataRGBA[4*idx+2] + 32768) >> 16;
                                        
                                        imageBGW[4*idx]=subimage[4*2+SUBIMAGE_DIM*i+j];
                                        imageBGW[4*idx+1]=imageBGW[4*idx];
                                        imageBGW[4*idx+2]=imageBGW[4*idx];
                                        imageBGW[4*idx+3]=255;
                                    }
                                }
                                await fetch('/upload', { method: 'POST', body: subimage }).then(() => {
                                    console.log('LOG: HTTP method of type POST requested');
                                }).catch(console.error);
                                new_data = new ImageData(imageBGW,canvas.width,canvas.height);
                                ctx.putImageData(new_data,0,0);

                                // Show preview
                                img.hidden = false;
                                img.src = canvas.toDataURL('image/jpeg');
                            }
                        }
                        
                        for (l=0;l<(canvas.height/SUBIMAGE_DIM-1^0);l++) {
                            subimage = new Uint8ClampedArray(4*2+SUBIMAGE_DIM*(canvas.width-SUBIMAGE_DIM*p));
                            subimage_view = new DataView(subimage.buffer);
                            subimage_view.setUint16(0,canvas.width-SUBIMAGE_DIM*p,true);
                            subimage_view.setUint16(2,SUBIMAGE_DIM,true);
                            subimage_view.setUint16(4,SUBIMAGE_DIM*p,true);
                            subimage_view.setUint16(6,l*SUBIMAGE_DIM,true);
                            for (i=0; i<SUBIMAGE_DIM; i++) {
                                for (j=0; j<canvas.width-SUBIMAGE_DIM*p; j++) {
                                    idx = canvas.width*(i+l*SUBIMAGE_DIM)+j+SUBIMAGE_DIM*p;
                                    
                                    subimage[4*2+SUBIMAGE_DIM*i+j]=(19595 * dataRGBA[4*idx] + 38470 * dataRGBA[4*idx+1] + 7471 * dataRGBA[4*idx+2] + 32768) >> 16;
                                    
                                    imageBGW[4*idx]=subimage[4*2+SUBIMAGE_DIM*i+j];
                                    imageBGW[4*idx+1]=imageBGW[4*idx];
                                    imageBGW[4*idx+2]=imageBGW[4*idx];
                                    imageBGW[4*idx+3]=255;
                                }
                            }
                            await fetch('/upload', { method: 'POST', body: subimage }).then(() => {
                                console.log('LOG: HTTP method of type POST requested');
                            }).catch(console.error);
                            new_data = new ImageData(imageBGW,canvas.width,canvas.height);
                            ctx.putImageData(new_data,0,0);

                            // Show preview
                            img.hidden = false;
                            img.src = canvas.toDataURL('image/jpeg');
                        }

                        for (p=0;p<(canvas.width/SUBIMAGE_DIM-1^0);p++) {
                            subimage = new Uint8ClampedArray(4*2+(canvas.height-l*SUBIMAGE_DIM)*SUBIMAGE_DIM);
                            subimage_view = new DataView(subimage.buffer);
                            subimage_view.setUint16(0,SUBIMAGE_DIM,true);
                            subimage_view.setUint16(2,canvas.height-l*SUBIMAGE_DIM,true);
                            subimage_view.setUint16(4,SUBIMAGE_DIM*p,true);
                            subimage_view.setUint16(6,l*SUBIMAGE_DIM,true);
                            for (i=0; i<canvas.height-l*SUBIMAGE_DIM; i++) {
                                for (j=0; j<SUBIMAGE_DIM; j++) {
                                    idx = canvas.width*(i+l*SUBIMAGE_DIM)+j+SUBIMAGE_DIM*p;
                                    
                                    subimage[4*2+SUBIMAGE_DIM*i+j]=(19595 * dataRGBA[4*idx] + 38470 * dataRGBA[4*idx+1] + 7471 * dataRGBA[4*idx+2] + 32768) >> 16;
                                    
                                    imageBGW[4*idx]=subimage[4*2+SUBIMAGE_DIM*i+j];
                                    imageBGW[4*idx+1]=imageBGW[4*idx];
                                    imageBGW[4*idx+2]=imageBGW[4*idx];
                                    imageBGW[4*idx+3]=255;
                                }
                            }
                            await fetch('/upload', { method: 'POST', body: subimage }).then(() => {
                                console.log('LOG: HTTP method of type POST requested');
                            }).catch(console.error);
                            new_data = new ImageData(imageBGW,canvas.width,canvas.height);
                            ctx.putImageData(new_data,0,0);

                            // Show preview
                            img.hidden = false;
                            img.src = canvas.toDataURL('image/jpeg');
                        }

                        subimage = new Uint8ClampedArray(4*2+(canvas.height-l*SUBIMAGE_DIM)*(canvas.width-SUBIMAGE_DIM*p));
                        subimage_view = new DataView(subimage.buffer);
                        subimage_view.setUint16(0,canvas.width-SUBIMAGE_DIM*p,true);
                        subimage_view.setUint16(2,canvas.height-l*SUBIMAGE_DIM,true);
                        subimage_view.setUint16(4,SUBIMAGE_DIM*p,true);
                        subimage_view.setUint16(6,l*SUBIMAGE_DIM,true);
                        for (i=0; i<canvas.height-l*SUBIMAGE_DIM; i++) {
                            for (j=0; j<canvas.width-SUBIMAGE_DIM*p; j++) {
                                idx = canvas.width*(i+l*SUBIMAGE_DIM)+j+SUBIMAGE_DIM*p;
                                
                                subimage[4*2+SUBIMAGE_DIM*i+j]=(19595 * dataRGBA[4*idx] + 38470 * dataRGBA[4*idx+1] + 7471 * dataRGBA[4*idx+2] + 32768) >> 16;
                                
                                imageBGW[4*idx]=subimage[4*2+SUBIMAGE_DIM*i+j];
                                imageBGW[4*idx+1]=imageBGW[4*idx];
                                imageBGW[4*idx+2]=imageBGW[4*idx];
                                imageBGW[4*idx+3]=255;
                            }
                        }
                        await fetch('/upload', { method: 'POST', body: subimage }).then(() => {
                            console.log('LOG: HTTP method of type POST requested');
                        }).catch(console.error);
                        
                        new_data = new ImageData(imageBGW,canvas.width,canvas.height);
                        ctx.putImageData(new_data,0,0);

                        // Show preview
                        img.hidden = false;
                        img.src = canvas.toDataURL('image/jpeg');
                    };
                    original.src = e.target.result;
                };
                reader.readAsDataURL(file);
            });
        </script>
    </body>
</html>
